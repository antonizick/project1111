# P11 curated model manifest (spec R9, A6, ADR-0006, ADR-0018). No weights live in git.
#
# Every entry is pinned: the URL names the Hugging Face commit, and the file's size and SHA-256
# must match after download or the file is deleted. `sets`: `default` is what
# `p11 models install default` fetches (≤ 30 GB, H1); `full` adds the measured alternatives;
# `optional` entries are only installed by ID. Licence flags drive the acknowledgement prompt
# and the "commercial use" column everywhere (H3). Schema: src/p11/models/manifest.py.
#
# Verification (R10): for each entry the repo revision, file size, LFS SHA-256 and licence tag were
# read from the Hugging Face API (`/api/models/<repo>` and `/api/models/<repo>/tree/main`) and the
# SHA-256 was recomputed with `sha256sum` over the downloaded file; licence URLs were fetched.
# Phases 10–12 add their own entries with the same schema.

schema_version = 1


[project]
name = "p11"
version = "1.0.1"
description = "Project_1111 (P11 Studio): fully local image generation over a headless ComfyUI engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
p11 = "p11.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p11"]
artifacts = ["src/p11/web"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
pythonpath = ["."]
markers = [
    "gpu: needs the real engine and an NVIDIA GPU (laptop only; takes the GPU lock)",
    "slow: slow test",
    "e2e: browser end-to-end test (needs Playwright and the built frontend)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/p11"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# nvidia-ml-py ships no type information.
module = ["pynvml"]
ignore_missing_imports = true
